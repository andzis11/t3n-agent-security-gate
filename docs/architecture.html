<!doctype html><html lang="en"><head><meta charset="utf-8"><title>T3N Agent Security Gate</title><style>body{margin:0;background:#020617;color:#e2e8f0;font:14px ui-monospace,monospace}.wrap{max-width:1100px;margin:32px auto;padding:24px}.card{border:1px solid #334155;border-radius:14px;background:#0f172a;padding:20px}h1{margin:0 0 6px;color:#f8fafc}p{color:#94a3b8}svg{width:100%;height:auto}.box{fill:#0f172a;stroke-width:2}.t{fill:#e2e8f0;font-size:15px;font-weight:bold}.s{fill:#94a3b8;font-size:11px}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}.deny{stroke:#fb7185;stroke-dasharray:6 5}.ok{stroke:#34d399}.note{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.note div{border:1px solid #334155;border-radius:9px;padding:12px;color:#cbd5e1}</style></head><body><div class="wrap"><h1>● T3N Agent Security Gate</h1><p>Fail-closed policy enforcement before an enterprise agent action executes</p><div class="card"><svg viewBox="0 0 1000 470" role="img" aria-label="Security gate architecture"><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5z" fill="#64748b"/></marker></defs><rect width="1000" height="470" fill="url(#g)"/><path class="arrow" d="M210 145H365"/><path class="arrow" d="M635 145H790"/><path class="arrow deny" d="M500 205V315H710"/><path class="arrow ok" d="M500 205V315H290"/><rect class="box" x="35" y="95" width="175" height="100" rx="8" stroke="#94a3b8"/><text class="t" x="122" y="130" text-anchor="middle">Enterprise Agent</text><text class="s" x="122" y="156" text-anchor="middle">signed action request</text><text class="s" x="122" y="174" text-anchor="middle">agent DID + nonce</text><rect class="box" x="365" y="70" width="270" height="135" rx="8" stroke="#fb7185"/><text class="t" x="500" y="108
